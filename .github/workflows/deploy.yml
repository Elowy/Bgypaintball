name: Deploy via FTP (cPanel)

# main/master push (PR merge) után FTP-n feltölti a statikus oldalt a tárhelyre.
# lftp-t használunk (mint egy FTP-kliens), mert megbízhatóbban kezeli a
# mappákat és az FTPS-t, mint a korábbi action.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: lftp telepítése
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Feltöltés (lftp mirror)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Hitelesítés .netrc-ből (a jelszó nem kerül a folyamat-argumentumokba).
          umask 077
          cat > "$HOME/.netrc" <<EOF
          machine $FTP_SERVER
          login $FTP_USERNAME
          password $FTP_PASSWORD
          EOF

          lftp "$FTP_SERVER" <<'SCRIPT'
          set cmd:fail-exit true
          # Sima FTP (TLS nélkül) – ahogy a Total Commander is kapcsolódik.
          # A szerver önaláírt FTPS-e a runnerről az adatcsatornán elhasalt.
          set ftp:ssl-allow false
          set ftp:passive-mode true
          set ftp:prefer-epsv true
          set net:connection-limit 1
          set net:timeout 25
          set net:max-retries 3
          set net:reconnect-interval-base 5
          debug 3
          # Feltöltés a fiók belépési könyvtárába (a dedikált fiók a webgyökérbe landol).
          # Ha a fő fiókot használod és a home-ba landolsz, írd át a végét: ./ /public_html/
          mirror -R --verbose --ignore-time \
            --exclude-glob .git* \
            --exclude .github/ \
            --exclude scripts/ \
            --exclude-glob *.md \
            --exclude-glob content-data.json* \
            ./ ./
          bye
          SCRIPT

          rm -f "$HOME/.netrc"
