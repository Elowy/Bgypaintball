name: Deploy to GitHub Pages

# Minden alkalommal lefut, amikor a fő ágra push történik (pl. egy PR merge-ölésekor).
# Így GitHub merge után a weboldal automatikusan frissül.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Egyszerre csak egy deploy fusson; a folyamatban lévőt megszakítjuk.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # A statikus oldal a repó gyökerében van; a teljes tartalmat feltöltjük.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
